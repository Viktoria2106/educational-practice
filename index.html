<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  
  <title>Железный дневник | Календарь тренировок</title>
  <link rel="stylesheet" href="/css/style.css">
</head>


<body>
  <div class="container">
    <div class="header">
      <h1>Календарь тренировок</h1>
      <div class="stats-badge" id="statsBadge">Всего упражнений: 0</div>
    </div>
  </div>

  <div class="dashboard">

    <div class="calendar-card">
      <div class="calendar-header">
        <button id="prevMonthBtn">◀</button>
        <span class="month-year" id="monthYearDisplay">Май 2026</span>
        <button id="nextMonthBtn">▶</button>
      </div>

      <div class="weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>

      <div class="calendar-days" id="calendarDaysContainer"></div>
      <div style="font-size: 11px; margin-top: 12px; text-align: center; opacity:0.7;">Клик по дню → показать тренировки</div>

    </div>
  </div>


  <script src="/js/utils.js"></script>
  <script src="/js/models.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
